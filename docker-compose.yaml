services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: hcm, POSTGRES_PASSWORD: hcm, POSTGRES_DB: hcmlite }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./backend
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment: { VITE_API_URL: "http://localhost:8000/api" }
volumes: { pgdata: {} }